name: Publish Biforcom MCR-202 v9.0

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12.5
    paths:
      - '.github/workflows/publish-v9.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful Run #5 firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 33406006842 \
            --repo deker1176/Biforcom-MCR-202 \
            --name openwrt-25.12.5-biforcom-mcr202 \
            --dir release-assets
          ls -lh release-assets

      - name: Verify firmware checksum
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SUMFILE='release-assets/SHA256SUMS'
          test -f "$IMAGE"
          test -f "$SUMFILE"
          EXPECTED="$(awk 'NR==1 {print $1}' "$SUMFILE")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Prepare corrected release notes
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          cat > release-notes.md <<EOF
          ## Biforcom MCR-202 — OpenWrt 25.12.5 v9

          Актуальная исправленная сборка OpenWrt 25.12.5 для Biforcom MCR-202 / NanoPi NEO (Allwinner H3).

          ### Исправление от 31.08.2026

          - опубликован успешный GitHub Actions **Run #5**;
          - исправлен MCR-202 Device Tree patch для USB host;
          - исправлены hunk sizes DT-патча;
          - корректно включены USB1/USB2;
          - сохранена последовательность питания модемов GPIO140/PE12 → GPIO141;
          - сохранены четыре Ethernet-порта в общем LAN-мосту.

          ### Состав

          - OpenWrt **25.12.5**;
          - Linux **6.12.94**;
          - русская LuCI;
          - **luci-app-5gmodem 2.4.38**;
          - Quectel EC25-EU;
          - Quectel EC200A;
          - MeigLink SLM750;
          - QMI / MBIM / ModemManager / serial / CDC / RNDIS / usb-modeswitch;
          - rootfs 1 ГБ.

          ### Прошивка

          \`openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz\`

          SHA-256:

          \`$SHA\`

          В релиз также входят полный build config и \`SHA256SUMS\`.

          Образ предназначен для microSD. Рабочую v8.0 рекомендуется сохранить до проверки USB host, Ethernet и обоих модемов на реальном MCR-202.
          EOF

      - name: Replace v9.0 release assets with successful Run #5 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v9.0 --repo deker1176/Biforcom-MCR-202 >/dev/null
          gh release upload v9.0 release-assets/* \
            --repo deker1176/Biforcom-MCR-202 \
            --clobber
          gh release edit v9.0 \
            --repo deker1176/Biforcom-MCR-202 \
            --title 'Biforcom MCR-202 — OpenWrt 25.12.5 v9 (Run #5 fixed)' \
            --notes-file release-notes.md
