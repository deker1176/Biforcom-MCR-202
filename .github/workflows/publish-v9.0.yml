name: Publish Biforcom MCR-202 v9.0 test build

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12.5
    paths:
      - '.github/workflows/publish-v9.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful Run #8 firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 39162706336 \
            --repo deker1176/Biforcom-MCR-202 \
            --name openwrt-25.12.5-biforcom-mcr202 \
            --dir release-assets
          ls -lh release-assets

      - name: Verify firmware checksum
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SUMFILE='release-assets/SHA256SUMS'
          test -f "$IMAGE"
          test -f "$SUMFILE"
          EXPECTED="$(awk 'NR==1 {print $1}' "$SUMFILE")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Verify OpenVPN packages in final config
        run: |
          CFG='release-assets/openwrt-25.12.5-mcr202.config'
          grep -q '^CONFIG_PACKAGE_openvpn-openssl=y$' "$CFG"
          grep -q '^CONFIG_PACKAGE_luci-app-openvpn=y$' "$CFG"
          grep -q '^CONFIG_PACKAGE_kmod-tun=y$' "$CFG"
          grep -q '^CONFIG_PACKAGE_kmod-ovpn-backports=y$' "$CFG"
          grep -q '^CONFIG_OPENVPN_openssl_ENABLE_DCO=y$' "$CFG"

      - name: Prepare release notes
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          cat > release-notes.md <<EOF
          ## Biforcom MCR-202 — OpenWrt 25.12.5 v9 test build / Run #8

          Актуальная тестовая сборка для Biforcom MCR-202 / NanoPi NEO (Allwinner H3).

          ### Изменения Run #8

          - подтверждённый фикс холодного старта LTE: после загрузки прошивка ждёт появления QMI-устройства, даёт модему время и автоматически перезапускает QMI-интерфейсы;
          - исправлен внешний feed luci-app-5gmodem: build-feed больше не должен попадать в runtime APK repositories как несуществующий `/modem/packages.adb`;
          - встроен **openvpn-openssl**;
          - встроен **luci-app-openvpn**;
          - встроены совместимые с этим ядром **kmod-tun** и **kmod-ovpn-backports**;
          - включён OpenVPN DCO;
          - сохранены исправления USB1/USB2, LAN1/LAN2 и внутреннего подключения модемов;
          - сохранена последовательность питания GPIO140/PE12 → GPIO141.

          ### Основа

          - OpenWrt **25.12.5**;
          - Linux **6.12.94**;
          - русская LuCI;
          - luci-app-5gmodem;
          - Quectel EC25-EU / EC200A;
          - MeigLink SLM750;
          - rootfs 1 ГБ.

          ### Прошивка

          \`openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz\`

          SHA-256:

          \`$SHA\`

          В релиз также входят полный build config и \`SHA256SUMS\`.

          Это тестовый build. Рекомендуется сохранить рабочую microSD до проверки на реальном MCR-202.
          EOF

      - name: Replace v9.0 release assets with Run #8 test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v9.0 --repo deker1176/Biforcom-MCR-202 >/dev/null
          gh release upload v9.0 release-assets/* \
            --repo deker1176/Biforcom-MCR-202 \
            --clobber
          gh release edit v9.0 \
            --repo deker1176/Biforcom-MCR-202 \
            --title 'Biforcom MCR-202 — OpenWrt 25.12.5 v9 test build (Run #8)' \
            --notes-file release-notes.md
