name: Publish Biforcom MCR-202 v9.0

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12.5
    paths:
      - '.github/workflows/publish-v9.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 33248261464 \
            --repo deker1176/Biforcom-MCR-202 \
            --name openwrt-25.12.5-biforcom-mcr202 \
            --dir release-assets
          ls -lh release-assets

      - name: Verify firmware checksum
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SUMFILE='release-assets/SHA256SUMS'
          test -f "$IMAGE"
          test -f "$SUMFILE"
          EXPECTED="$(awk 'NR==1 {print $1}' "$SUMFILE")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Prepare release notes
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          cat > release-notes.md <<EOF
          ## Biforcom MCR-202 — OpenWrt 25.12.5 v9

          Готовый образ OpenWrt 25.12.5 для Biforcom MCR-202 / NanoPi NEO (Allwinner H3), собранный из воспроизводимого проекта ветки \`openwrt-25.12.5\`.

          ### Основные изменения относительно v8.0

          - обновление базовой системы с OpenWrt 25.12.0 до **OpenWrt 25.12.5**;
          - ядро Linux **6.12.94**;
          - сохранена поддержка четырёх Ethernet-портов в общем LAN-мосту;
          - сохранена аппаратная последовательность питания двух LTE-модемов MCR-202: GPIO140/PE12 и GPIO141;
          - добавлена русская локализация LuCI;
          - добавлен **luci-app-5gmodem 2.4.38**;
          - поддержка **Quectel EC25-EU**;
          - поддержка **Quectel EC200A**;
          - поддержка **MeigLink SLM750** через штатный патч OpenWrt qmi_wwan/option;
          - включены QMI, MBIM, ModemManager, serial, CDC, RNDIS и usb-modeswitch компоненты;
          - rootfs-раздел оставлен размером 1 ГБ;
          - сборка выполняется автоматически через GitHub Actions.

          ### Файл прошивки

          \`openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz\`

          SHA-256:

          \`$SHA\`

          Дополнительно приложены полный build config и файл \`SHA256SUMS\`.

          ### Установка

          Образ предназначен для записи на microSD. Для первого теста рекомендуется использовать отдельную карту и не перезаписывать рабочую v8.0 до проверки Ethernet, обоих модемов и управления питанием на конкретной ревизии платы.
          EOF

      - name: Publish GitHub Release v9.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v9.0 --repo deker1176/Biforcom-MCR-202 >/dev/null 2>&1; then
            echo 'Release v9.0 already exists; uploading/replacing assets.'
            gh release upload v9.0 release-assets/* \
              --repo deker1176/Biforcom-MCR-202 \
              --clobber
            gh release edit v9.0 \
              --repo deker1176/Biforcom-MCR-202 \
              --title 'Biforcom MCR-202 — OpenWrt 25.12.5 v9' \
              --notes-file release-notes.md
          else
            gh release create v9.0 release-assets/* \
              --repo deker1176/Biforcom-MCR-202 \
              --target f2e756bef1558437fc423aef571deb09ee4331c8 \
              --title 'Biforcom MCR-202 — OpenWrt 25.12.5 v9' \
              --notes-file release-notes.md
          fi
