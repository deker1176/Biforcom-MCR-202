name: Publish Biforcom MCR-202 v9.1

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12.5
    paths:
      - '.github/workflows/publish-v9.0.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download successful firmware artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets
          gh run download 33406006842 \
            --repo deker1176/Biforcom-MCR-202 \
            --name openwrt-25.12.5-biforcom-mcr202 \
            --dir release-assets
          ls -lh release-assets

      - name: Verify firmware checksum
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SUMFILE='release-assets/SHA256SUMS'
          test -f "$IMAGE"
          test -f "$SUMFILE"
          EXPECTED="$(awk 'NR==1 {print $1}' "$SUMFILE")"
          ACTUAL="$(sha256sum "$IMAGE" | awk '{print $1}')"
          echo "Expected: $EXPECTED"
          echo "Actual:   $ACTUAL"
          test "$EXPECTED" = "$ACTUAL"

      - name: Prepare release notes
        run: |
          IMAGE='release-assets/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz'
          SHA="$(sha256sum "$IMAGE" | awk '{print $1}')"
          cat > release-notes.md <<EOF
          ## Biforcom MCR-202 — OpenWrt 25.12.5 v9.1

          Исправленная сборка OpenWrt 25.12.5 для Biforcom MCR-202 / NanoPi NEO (Allwinner H3), собранная из ветки \`openwrt-25.12.5\`.

          ### Что исправлено в v9.1

          - исправлен MCR-202 Device Tree patch для USB host контроллеров;
          - исправлены hunk sizes патча и корректное включение USB1/USB2;
          - сборка успешно завершена в GitHub Actions Run #5;
          - сохранена аппаратная последовательность питания модемов: GPIO140/PE12 и GPIO141;
          - сохранены четыре Ethernet-порта в общем LAN-мосту.

          ### Основа и поддержка модемов

          - OpenWrt **25.12.5**;
          - Linux **6.12.94**;
          - русская локализация LuCI;
          - **luci-app-5gmodem 2.4.38**;
          - Quectel **EC25-EU**;
          - Quectel **EC200A**;
          - MeigLink **SLM750**;
          - QMI, MBIM, ModemManager, serial, CDC, RNDIS и usb-modeswitch;
          - rootfs-раздел 1 ГБ.

          ### Файл прошивки

          \`openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz\`

          SHA-256:

          \`$SHA\`

          Дополнительно приложены полный build config и \`SHA256SUMS\`.

          ### Установка

          Образ предназначен для записи на microSD. Для первого теста рекомендуется использовать отдельную карту и сохранить рабочую v8.0 до проверки Ethernet, USB host, обоих модемов и управления питанием на реальном MCR-202.
          EOF

      - name: Publish GitHub Release v9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v9.1 --repo deker1176/Biforcom-MCR-202 >/dev/null 2>&1; then
            echo 'Release v9.1 already exists; uploading/replacing assets.'
            gh release upload v9.1 release-assets/* \
              --repo deker1176/Biforcom-MCR-202 \
              --clobber
            gh release edit v9.1 \
              --repo deker1176/Biforcom-MCR-202 \
              --title 'Biforcom MCR-202 — OpenWrt 25.12.5 v9.1' \
              --notes-file release-notes.md
          else
            gh release create v9.1 release-assets/* \
              --repo deker1176/Biforcom-MCR-202 \
              --target 8e3364ae4d056234cde863038efd5472205d16e2 \
              --title 'Biforcom MCR-202 — OpenWrt 25.12.5 v9.1' \
              --notes-file release-notes.md
          fi
