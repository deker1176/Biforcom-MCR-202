name: Build OpenWrt 25.12.5 MCR-202

on:
  workflow_dispatch:
  push:
    branches:
      - openwrt-25.12.5
    paths:
      - 'builder/**'
      - '.github/workflows/build-openwrt-25.12.5.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout MCR-202 project
        uses: actions/checkout@v4

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext \
            git libncurses-dev libssl-dev python3 python3-setuptools rsync \
            unzip zlib1g-dev file wget curl jq swig time qemu-utils \
            device-tree-compiler

      - name: Build firmware
        env:
          JOBS: '2'
        run: |
          chmod +x builder/build.sh
          ./builder/build.sh

      - name: Show build outputs
        run: |
          ls -lh output/
          cat output/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.5-biforcom-mcr202
          path: |
            output/openwrt-25.12.5-biforcom-mcr202-squashfs-sdcard.img.gz
            output/openwrt-25.12.5-mcr202.config
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
